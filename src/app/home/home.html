<ul>
  <li *ngFor="let food of foods">
    <a>
      <img src="{{ food.imageUrl }}" alt="" />
      <div class="content">
        <div class="name">{{ food.name }}</div>
        <span class="favorite {{ food.favorite ? '' : 'not' }}"> ❤ </span>
        <app-rating-component> </app-rating-component>
        <div class="product-item-footer">
          <div class="origins">
            <span *ngFor="let origin of food.origins">{{ origin }}</span>
          </div>
          <div class="cook-time">
            <span> ⏱ </span>
            {{ food.cookTime }}
          </div>
          <div class="price">
            <span> 💲 </span>
            {{ food.price }}
          </div>
        </div>
      </div>
    </a>
  </li>
</ul>
